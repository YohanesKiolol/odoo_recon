name: Build & Release Desktop Apps (Windows & macOS)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create empty folders
        run: |
          New-Item -ItemType Directory -Force -Path input
          New-Item -ItemType Directory -Force -Path output
          New-Item -ItemType Directory -Force -Path mutations
          New-Item -ItemType Directory -Force -Path recap
        shell: pwsh

      - name: Build Recon (Finance GUI)
        run: pyinstaller bank_recon.spec --clean --noconfirm

      - name: Build SalesPortal (Store GUI)
        run: pyinstaller SalesPortal.spec --clean --noconfirm

      - name: Publish Windows Apps to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "Latest Desktop Builds (Windows & macOS)"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/Recon.exe
            dist/SalesPortal.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS (.app & .dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pyinstaller

      - name: Create empty folders
        run: |
          mkdir -p input output mutations recap

      - name: Build Recon (Finance GUI)
        run: pyinstaller bank_recon.spec --clean --noconfirm

      - name: Build SalesPortal (Store GUI)
        run: pyinstaller SalesPortal.spec --clean --noconfirm

      - name: Code Sign & Package macOS DMGs
        run: |
          codesign --force --deep --sign - dist/Recon.app
          codesign --force --deep --sign - dist/SalesPortal.app

          # Build Recon DMG via staging folder
          mkdir -p /tmp/dmg_recon
          cp -R dist/Recon.app /tmp/dmg_recon/
          hdiutil create -volname "Recon" -srcfolder /tmp/dmg_recon -ov -format UDZO dist/Recon-macOS.dmg
          rm -rf /tmp/dmg_recon
          sleep 2

          # Build SalesPortal DMG via staging folder
          mkdir -p /tmp/dmg_sales
          cp -R dist/SalesPortal.app /tmp/dmg_sales/
          hdiutil create -volname "SalesPortal" -srcfolder /tmp/dmg_sales -ov -format UDZO dist/SalesPortal-macOS.dmg
          rm -rf /tmp/dmg_sales

      - name: Publish macOS Apps to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "Latest Desktop Builds (Windows & macOS)"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist/Recon-macOS.dmg
            dist/SalesPortal-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
