name: Build Desktop Apps (Windows & macOS)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium

      - name: Create empty folders
        run: |
          New-Item -ItemType Directory -Force -Path input
          New-Item -ItemType Directory -Force -Path output
          New-Item -ItemType Directory -Force -Path mutations
          New-Item -ItemType Directory -Force -Path recap
        shell: pwsh

      - name: Build Recon (Finance GUI)
        run: pyinstaller bank_recon.spec --clean --noconfirm

      - name: Build SalesPortal (Store GUI)
        run: pyinstaller SalesPortal.spec --clean --noconfirm

      - name: Upload Recon Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Recon-Windows-EXE
          path: dist/Recon.exe
          retention-days: 1

      - name: Upload SalesPortal Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SalesPortal-Windows-EXE
          path: dist/SalesPortal.exe
          retention-days: 1

  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pyinstaller

      - name: Install Playwright Browsers
        run: |
          python3 -m playwright install chromium

      - name: Create empty folders
        run: |
          mkdir -p input output mutations recap

      - name: Build Recon (Finance GUI)
        run: pyinstaller bank_recon.spec --clean --noconfirm

      - name: Build SalesPortal (Store GUI)
        run: pyinstaller SalesPortal.spec --clean --noconfirm

      - name: Code Sign & Package macOS Apps (DMG & ZIP)
        run: |
          codesign --force --deep --sign - dist/Recon.app
          codesign --force --deep --sign - dist/SalesPortal.app

          # Build Recon DMG via staging folder
          mkdir -p /tmp/dmg_recon
          cp -R dist/Recon.app /tmp/dmg_recon/
          hdiutil create -volname "Recon" -srcfolder /tmp/dmg_recon -ov -format UDZO dist/Recon-macOS.dmg
          rm -rf /tmp/dmg_recon
          sleep 2

          # Build SalesPortal DMG via staging folder
          mkdir -p /tmp/dmg_sales
          cp -R dist/SalesPortal.app /tmp/dmg_sales/
          hdiutil create -volname "SalesPortal" -srcfolder /tmp/dmg_sales -ov -format UDZO dist/SalesPortal-macOS.dmg
          rm -rf /tmp/dmg_sales

          cd dist
          zip -r -y Recon-macOS.zip Recon.app
          zip -r -y SalesPortal-macOS.zip SalesPortal.app
          cd ..

      - name: Upload Recon macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Recon-macOS-DMG
          path: dist/Recon-macOS.dmg
          retention-days: 1

      - name: Upload SalesPortal macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: SalesPortal-macOS-DMG
          path: dist/SalesPortal-macOS.dmg
          retention-days: 1
