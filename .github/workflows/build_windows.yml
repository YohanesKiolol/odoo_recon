name: Build Windows EXE

on:
  push:
    branches: [master, main]   # supports both branch naming conventions
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create empty input / output folders
        run: |
          New-Item -ItemType Directory -Force -Path input
          New-Item -ItemType Directory -Force -Path output
        shell: pwsh

      - name: Build EXE with PyInstaller
        run: pyinstaller bank_recon.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankRekonsiliasi-Windows
          path: dist\BankRekonsiliasi.exe
          retention-days: 30
